# 性能优化配置
[performance]
# 是否启用性能监控
enable_monitoring = true

# 性能日志级别
log_level = "info"

# 性能统计间隔（秒）
stats_interval = 60

# 是否启用慢查询日志
enable_slow_query_log = true

# 慢查询阈值（毫秒）
slow_query_threshold = 1000

# 验证配置
[validation]
# 是否启用 SQL 验证
enable_validation = true

# 验证严格级别
strict_level = "warning"

# 是否启用安全检查
enable_security_check = true

# 是否启用性能检查
enable_performance_check = true

# 格式化配置
[formatting]
# 缩进大小
indent_size = 4

# 是否大写关键字
uppercase_keywords = true

# 最大行长度
max_line_length = 120

# 是否保留注释
preserve_comments = true

# 日志配置
[logging]
# 日志级别
level = "info"

# 日志格式
format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# 日志文件路径
file_path = "logs/sqlop.log"

# 是否启用控制台日志
enable_console = true

# 是否启用文件日志
enable_file = true

# 日志轮转配置
[logging.rotation]
# 最大文件大小（MB）
max_size = 100

# 最大备份数量
max_backups = 10

# 最大保存天数
max_age = 30