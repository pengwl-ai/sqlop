# SQL 解析引擎配置文件

[parser]
# 最大解析时间（毫秒）
max_parse_time_ms = 1000

# 是否启用缓存
enable_cache = true

# 缓存大小
cache_size = 10000

# 是否启用并行处理
enable_parallel = true

# 最大工作线程数
max_workers = 4

# 敏感信息模式配置
[[sensitive_patterns]]
name = "身份证号"
pattern = r"\b\d{17}[\dXx]\b"
description = "匹配中国身份证号码"
column_names = ["id_card", "identity_card", "sfz"]
table_names = ["users", "employees", "customers"]

[[sensitive_patterns]]
name = "手机号"
pattern = r"\b1[3-9]\d{9}\b"
description = "匹配中国手机号码"
column_names = ["phone", "mobile", "telephone"]
table_names = ["users", "contacts", "customers"]

[[sensitive_patterns]]
name = "邮箱"
pattern = r"\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b"
description = "匹配邮箱地址"
column_names = ["email", "mail", "e_mail"]
table_names = ["users", "customers", "contacts"]

[[sensitive_patterns]]
name = "密码"
pattern = r"(?i)\bpassword\b"
description = "匹配密码相关字段"
column_names = ["password", "pwd", "passwd"]
table_names = ["users", "accounts", "auth"]

# 数据库特定配置
[database_configs.MySQL]
quote_char = '`'
identifier_case_sensitive = false
support_schema = true
default_schema = null
custom_keywords = ["AUTO_INCREMENT", "ENGINE", "CHARSET"]

[database_configs.PostgreSQL]
quote_char = '"'
identifier_case_sensitive = false
support_schema = true
default_schema = "public"
custom_keywords = ["SERIAL", "BIGSERIAL", "TEXT"]

[database_configs.SQLServer]
quote_char = '['
identifier_case_sensitive = false
support_schema = true
default_schema = "dbo"
custom_keywords = ["IDENTITY", "NVARCHAR", "NTEXT"]

