[package]
name = "sqlop"
version = "0.1.0"
edition = "2021"
authors = ["SQL Parser Team"]
description = "高性能 SQL 解析引擎，支持多种数据库的审计日志解析"

[dependencies]
# SQL 解析核心
sqlparser = "0.43.0"
tree-sitter = "0.20.10"
tree-sitter-sql = "0.0.2"

# 异步运行时
tokio = { version = "1.35.0", features = ["full"] }
async-trait = "0.1.75"

# 序列化/反序列化
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0.108"

# UUID 生成
uuid = { version = "1.6.1", features = ["v4", "serde"] }

# 时间处理
chrono = "0.4.31"

# 日志和错误处理
log = "0.4.20"
env_logger = "0.10.1"
thiserror = "1.0.51"
anyhow = "1.0.75"

# 性能优化
rayon = "1.8.0"
crossbeam = "0.8.4"
parking_lot = "0.12.1"
lru = "0.11.1"
lazy_static = "1.4.0"
once_cell = "1.18.0"

# 正则表达式
regex = "1.10.2"
fancy-regex = "0.12.0"

# 数据库特定支持
mysql_async = "0.34.0"
postgres = "0.19.7"
tiberius = { version = "0.12.2", features = ["sql-browser-tokio"] }
oracle = { version = "0.5.7", features = ["chrono"] }

# 配置管理
config = "0.13.4"
toml = "0.8.8"

# 测试
mockall = "0.12.1"
criterion = { version = "0.5.1", features = ["html_reports"] }

# Excel文件处理
calamine = "0.22.0"

[dev-dependencies]
tokio-test = "0.4.3"
test-log = "0.2.14"

[features]
default = ["mysql", "postgresql", "sqlserver", "oracle"]
mysql = []
postgresql = []
sqlserver = []
oracle = []
hive = []
gauss = []
kingbase = []
highgo = []
greenplum = []
vastbase = []
sybase = []
db2 = []
dameng = []

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3

[profile.dev]
opt-level = 1

[[bench]]
name = "parser_benchmark"
path = "tests/benchmarks/parser_benchmark.rs"
harness = false





[[bin]]
name = "eps_test"
path = "tests/performance/eps_test.rs"